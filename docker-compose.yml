services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: aember-postgres
    environment:
      POSTGRES_USER: aember
      POSTGRES_PASSWORD: aember
      POSTGRES_DB: aember
    ports:
      - "54320:5432"
    volumes:
      - aember-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aember -d aember" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aember-postgres-data:
